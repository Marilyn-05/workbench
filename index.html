<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广东专插本备考工作台 ♡</title>
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=20260818">
<link rel="icon" type="image/png" href="favicon.png?v=20260818">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260818">
<link rel="manifest" href="manifest.webmanifest?v=20260818">
<meta name="theme-color" content="#e589a6">
<style>
  :root{
    --side-w:200px;
    --bg:#fdf3f6; --pink:#f9cdda; --pink-soft:#fde4ec; --pink-deep:#e589a6;
    --accent:#ef9bb3; --text:#7a5c66; --muted:#b89aa3; --line:#f4dde4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background-image:radial-gradient(var(--pink) 1.4px,transparent 1.4px);background-size:22px 22px;opacity:.35}
  a{color:inherit;text-decoration:none}

  /* ===== 左侧导航（常驻框架） ===== */
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:var(--side-w);
    background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
    border-right:1px solid var(--line);
    padding:22px 14px;overflow-y:auto;z-index:100;
  }
  .side-avatar{text-align:center;margin-bottom:14px}
  .side-avatar img{width:84px;height:84px;border-radius:50%;object-fit:cover;
    border:3px solid #fff;box-shadow:0 4px 14px rgba(229,137,166,.25);margin-bottom:8px}
  .side-name{font-size:16px;font-weight:700;color:var(--pink-deep);letter-spacing:.5px}
  .side-sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:14px}
  .nav-group{margin-bottom:8px}
  .nav-label{font-size:15px;color:var(--pink-deep);font-weight:800;
    padding:9px 10px;margin:12px 0 6px;letter-spacing:1px;
    background:var(--pink-soft);border-radius:11px;display:flex;align-items:center;gap:6px}
  .nav-item{display:block;padding:9px 12px;border-radius:12px;font-size:14px;color:var(--text);
    margin:3px 0;transition:.2s;cursor:pointer;border:1px solid transparent}
  .nav-item:hover{background:var(--pink-soft)}
  .nav-item.active{background:var(--pink);color:#fff;font-weight:600}

  /* ===== 内容 iframe（铺满导航栏右侧全部区域） ===== */
  .content{position:fixed;top:0;left:var(--side-w);width:calc(100% - var(--side-w));height:100vh;border:none;right:auto;bottom:auto}

  /* 移动端：侧栏仍常驻可见，仅收窄宽度，主内容始终在右侧（不使用抽屉/按钮） */
  @media(max-width:900px){
    :root{--side-w:160px}
    .sidebar{padding:16px 10px}
    .nav-label{font-size:14px;padding:7px 8px;letter-spacing:.5px}
    .nav-item{font-size:13px;padding:8px 10px}
    .side-avatar img{width:64px;height:64px;margin-bottom:6px}
    .side-name{font-size:15px}
    .side-sub{font-size:11px;margin-bottom:10px}
  }
  @media(max-width:480px){
    :root{--side-w:100px}
    .sidebar{padding:10px 6px}
    .nav-label{font-size:11px;padding:5px 5px;letter-spacing:0}
    .nav-item{font-size:11px;padding:5px 6px}
    .side-avatar img{width:42px;height:42px}
    .side-name{font-size:12px}
    .side-sub{display:none}
  }
  @media(max-width:360px){
    :root{--side-w:90px}
    .nav-label{font-size:10px;padding:4px 4px}
    .nav-item{font-size:10px;padding:4px 5px}
  }
</style>
</head>

      const q = p.toString();

  const content = document.getElementById('content');
  const navItems = document.querySelectorAll('.nav-item');

  // 设置内容页
  let currentPage = 'quick/overview.html';
  function go(page){
    const clean = page.split('?')[0];
    currentPage = clean;
    if(PAGES && PAGES[clean]){
      content.srcdoc = inject(PAGES[clean]);
    }else{
      content.src = page + (page.includes('?') ? '&' : '?') + '_t=' + Date.now();
    }
    navItems.forEach(n=> n.classList.toggle('active', n.dataset.page === currentPage));
  }
  window.go = go;
  loadPages().then(()=> go('quick/overview.html')).catch(e=>{
    document.getElementById('content').srcdoc = '<p style="padding:40px">加载失败：'+e.message+'</p>';
  });
  navItems.forEach(it=>{
    it.addEventListener('click', ()=> go(it.dataset.page));
  });

  // iframe 加载后，尽力根据地址高亮（跨域/本地文件失败时不影响，仍以点击为准）
  content.addEventListener('load', ()=>{
    try{
      const url = content.contentWindow.location.pathname.split('/').pop();
      const hash = content.contentWindow.location.hash;
      const target = url === 'overview.html' ? 'quick/overview.html'+hash : 'quick/'+url;
      navItems.forEach(n=> n.classList.toggle('active', n.dataset.page === target));
    }catch(e){}
  });

</script>
